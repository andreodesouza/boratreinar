<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bora Treinar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class = "container">
    <div>
      <img id="logo" class="logo" src="img/logo.png" alt="">
    </div>
    <div id="telaInicial" class="tela-inicial">
      <h2>Comece agora mesmo!</h2>
      <button id="btnLogin" class="login-btn">Login</button>
      <button id="btnRegistrar" class="register-btn">Registrar</button>
    </div>   
    <div id="telaLogin" class="tela-login">
      <h2>Treine com os melhores</h2>
      <input type="text" placeholder="Usuário">
      <input type="text" placeholder="Senha">
        <div class="checkbox-group">
          <input type="checkbox" id="lembrar" name="lembrar">
          <label for="lembrar">Lembre-me sempre</label>
        </div>
      <button class = "entrar" onclick="login()">Login</button>
      <button id= "btnVoltar" class = "voltar-btn">Voltar</button>
    </div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
