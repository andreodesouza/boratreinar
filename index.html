<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bora Treinar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class = "container">
    <div>
      <img id="logo" class="logo" src="img/logo.png" alt="">
    </div>
    <div id="telaInicial" class="tela-inicial">
      <h2>Comece agora mesmo!</h2>
      <button id="btnLogin" class="login-btn">Login</button>
      <button id="btnRegistrar" class="register-btn">Registrar</button>
    </div>   
    <div id="telaLogin" class="tela-login">
      <h2>Treine com os melhores</h2>
      <input type="text" placeholder="Usuário">
      <input type="text" placeholder="Senha">
        <div class="checkbox-group">
          <input type="checkbox" id="lembrar" name="lembrar">
          <label for="lembrar">Lembre-me sempre</label>
        </div>
      <button class = "entrar" onclick="login()">Login</button>
      <button id= "btnVoltar" class = "voltar-btn">Voltar</button>
    </div>
    <div id="telaregister" class="tela-register">
      <h2>Crie sua conta</h2>
      <input type="text" placeholder="Email">
      <input type="text" placeholder="Senha">
      <input type="text" placeholder="Telefone">
      <button id="btncontinuar" class="btn-continuar">Continuar</button>
      <button id="btnvoltar2" class="voltar-btn2">Voltar</button>
      <p>- Ou entre usando -</p>
    </div>
    <div id="dados" class="dados">
      <div id="telregister2" class="tela-register2">
        <h2>Estamos quase lá!</h2>
        <input type="text" id="nomeRegistro" placeholder="Nome completo">
      </div>
      <div id="telaregister3" class="tela-register3">
        <select name="sexo" id="sexo">
        <option value="">Sexo</option>  
        <option value="">Masculino</option> 
        <option value="">Feminino</option> 
        </select>
        <input type="number" placeholder="Peso">
      </div>
      <div id="telaregister3" class="tela-register3">
        <input type="number" placeholder="Altura">
        <input type="text" placeholder="País">
      </div>
      <div>
        <button>Registrar</button>
      </div>
    </div>
  </div>
  <script src="js/script.js"></script>
</body>
</html>
