<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bora Treinar!</title>
    <link rel="stylesheet" href="css/telainicial.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">

        <header class="topo">
            <div class="perfil">
                <img src="img/perfil.jpg" alt="Perfil" class="avatar">
                <div>
                    <p class="bemvinda">Bem-vindo(a)</p>
                    <h2 id="nomeUsuario"></h2>
                    <p id="sair" class="bemvinda" onclick="sair()" style="cursor: pointer;">Sair</p>
                </div>
            </div>
            <div class="notificacao">
                <i class="bell">🔔</iclass></i>
            </div>        
        </header>

        <section id= "metricas" class="metricas">
            <div class="card-metrica">
                <div class="icone">🔥</div>
                <p class="valor">6.60 CAL</p>
                <p class="rotulo">Perdidas Hoje</p>
            </div>
            <div class="card-metrica">
                <div class="icone">👣</div>
                <p class="valor">1350</p>
                <p class="rotulo">Passos</p>
            </div>
            <div class="card-metrica">
                <div class="icone">❤️</div>
                <p class="valor">102 BPM</p>
                <p class="rotulo">Batimentos</p>
            </div>
        </section>
        <section id="treinos" class="treinos">
            <div class="card-treino">
                <img id="btnpeito" src="img/peito.jpeg" alt="Peito" style="cursor: pointer;">
                <div class="info">
                    <h3>Peito</h3>
                    <p>50 min • 123 Cal</p>
                </div>
                    <span class="play">▶</span>
            </div>

      <div class="card-treino">
        <img src="img/costas.jpg" alt="Costas">
        <div class="info">
          <h3>Costas</h3>
          <p>60 min • 82 Cal</p>
        </div>
        <span class="play">▶</span>
      </div>

      <div class="card-treino">
        <img src="img/pernas.jpg" alt="Pernas">
        <div class="info">
          <h3>Pernas</h3>
          <p>60 min • 98 Cal</p>
        </div>
        <span class="play">▶</span>
      </div>

      <a href="#" class="vermais">Ver mais...</a>
    </section>

    <button id="botao-principal" class="botao-principal">CRIE SEU PLANO DE TREINO</button>

    <section id="novidades" class="novidades">
      <div class="banner">
        <img src="img/novidades.jpg" alt="Novidades">
        <div class="tag">NOVIDADES</div>
      </div>
    </section>

    <section id="peito" class="peito">
      <div class="lista-exercicios">
        <h2>Exercícios para Peito</h2>
        <p>3rep</p>
      </div>  
      <div class="card-treino">
        <img src="img/supinoreto.jpg" alt="Supino Reto">
        <div class="info">
          <h3>10 X Supino Reto</h3>
          <p>2 min • 48 Kcal</p>
        </div>
        <span class="play">▶</span>
      </div>

    </section>

    <nav class="menu">
      <i>🏠</i>
      <i>💪</i>
      <div class="botao-centro">+</div>
      <i>🍴</i>
      <i>👤</i>
    </nav>
  </div>
  <script>
  window.addEventListener("DOMContentLoaded", () => {
    const logado = JSON.parse(localStorage.getItem('usuarioLogado'));
    const nomeEl = document.getElementById('nomeUsuario');

    if (logado && nomeEl) {
      nomeEl.textContent = logado.nome || logado.email;
    } else {
      console.warn("Nenhum usuário logado, voltando para o login...");
      setTimeout(() => {
        window.location.replace("index.html");
      }, 500);
    }
  });
  </script>
  <script>
  document.addEventListener("DOMContentLoaded", function() {
    const btnPeito = document.getElementById("btnpeito");

  btnPeito.addEventListener('click', function() {
    // esconde as seções da tela inicial
    document.getElementById("metricas").style.display = "none";
    document.getElementById("treinos").style.display = "none";
    document.getElementById("novidades").style.display = "none";
    document.getElementById("botao-principal").style.display = "none";

    // mostra a tela de peito
    const peito = document.getElementById("peito");
    peito.style.display = "flex";

    // rola para o topo da nova seção
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
});
</script>

  <script src="js/script.js"></script>

</body>
</html>
