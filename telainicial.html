<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bora Treinar!</title>
    <link rel="stylesheet" href="css/telainicial.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">

        <header class="topo">
            <div class="perfil">
                <img src="img/perfil.jpg" alt="Perfil" class="avatar">
                <div>
                    <p class="bemvinda">Bem-vindo(a)</p>
                    <h2>André Souza</h2>
                </div>
            </div>
            <div class="notificacao">
                <i class="bell">🔔</iclass></i>
            </div>        
        </header>

        <section class="metricas">
            <div class="card-metrica">
                <div class="icone">🔥</div>
                <p class="valor">6.60 CAL</p>
                <p class="rotulo">Peridas Hoje</p>
            </div>
            <div class="card-metrica">
                <div class="icone">👣</div>
                <p class="valor">1350</p>
                <p class="rotulo">Passos</p>
            </div>
            <div class="card-metrica">
                <div class="icone">❤️</div>
                <p class="valor">102 BPM</p>
                <p class="rotulo">Batimentos</p>
            </div>
        </section>
        <section class="treinos">
      <div class="card-treino">
        <img src="img/peito.jpeg" alt="Peito">
        <div class="info">
          <h3>Peito</h3>
          <p>50 min • 123 Cal</p>
        </div>
        <span class="play">▶</span>
      </div>

      <div class="card-treino">
        <img src="img/costas.jpg"Costas">
        <div class="info">
          <h3>Costas</h3>
          <p>60 min • 82 Cal</p>
        </div>
        <span class="play">▶</span>
      </div>

      <div class="card-treino">
        <img src="img/pernas.jpg" alt="Pernas">
        <div class="info">
          <h3>Pernas</h3>
          <p>60 min • 98 Cal</p>
        </div>
        <span class="play">▶</span>
      </div>

      <a href="#" class="vermais">Ver mais...</a>
    </section>

    <button class="botao-principal">CRIE SEU PLANO DE TREINO</button>

    <section class="novidades">
      <div class="banner">
        <img src="img/novidades.jpg" alt="Novidades">
        <div class="tag">NOVIDADES</div>
      </div>
    </section>

    <nav class="menu">
      <i>🏠</i>
      <i>💪</i>
      <div class="botao-centro">+</div>
      <i>🍴</i>
      <i>👤</i>
    </nav>

  </div>
</body>
</html>
